<app-auth-layout
  brandSide="right"
  variant="features"
  brandTitle="Find the best deal before you sign."
  brandText="One place to compare what Uganda's banks charge, so you stop overpaying on loans, accounts and insurance."
>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Log in to compare loans, accounts and insurance across Ugandan banks.</p>

  <form class="auth-form" (ngSubmit)="submit()" novalidate>
    <div class="auth-field">
      <label for="email">Email</label>
      <input class="auth-input" id="email" type="email" [(ngModel)]="email" name="email"
             placeholder="you@example.com" autocomplete="email" [disabled]="loading()" />
    </div>

    <app-password-field label="Password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" [(value)]="password" [disabled]="loading()" />

    <div class="auth-row"><a routerLink="/forgot-password">Forgot password?</a></div>

    @if (error()) {
      <div class="auth-error" role="alert">{{ error() }}</div>
    }

    <button class="auth-btn" type="submit" [disabled]="loading()">
      @if (loading()) { Signing in… } @else { Log in }
    </button>
  </form>

  <p class="auth-switch">New to Fincomp? <a routerLink="/signup">Create an account</a></p>
</app-auth-layout>
