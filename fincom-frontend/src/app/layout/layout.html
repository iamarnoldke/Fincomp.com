<div class="shell">
  <div class="main">
    <header class="topbar">
      <a class="logo" routerLink="/dashboard" aria-label="Fincomp dashboard" (click)="closeMenu()">
        <span class="logo-mark" aria-hidden="true">F</span>
        <span class="brand-copy">
          <strong>Fincomp</strong>
          <small>Finance hub</small>
        </span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-controls="site-menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        [class.open]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <div class="menu" id="site-menu" [class.open]="menuOpen()">
        <nav class="nav" aria-label="Main navigation">
          @for (item of navItems(); track item.path) {
            <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">{{ item.label }}</a>
          }
        </nav>

        <div class="topbar-actions">
          @if (isLoggedIn()) {
            <span class="user-chip">Hi, {{ user()?.name ?? 'there' }}</span>
            <button class="logout" type="button" (click)="logout()">Log out</button>
          } @else {
            <a class="login-link" routerLink="/login" (click)="closeMenu()">Log in</a>
          }
        </div>
      </div>
    </header>

    <main class="page" id="page-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
