<div class="auth-field">
  <label [attr.for]="name()">{{ label() }}</label>
  <div class="auth-input-wrap">
    <input
      class="auth-input"
      [id]="name()"
      [name]="name()"
      [type]="visible() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
    />
    <button
      class="auth-eye"
      type="button"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      (click)="toggle()"
    >
      @if (visible()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a17.9 17.9 0 0 1 4.2-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      }
    </button>
  </div>
  @if (hint()) {
    <p class="auth-hint">{{ hint() }}</p>
  }
</div>
