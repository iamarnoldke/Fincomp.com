<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="eyebrow">Create account</span>
      <h1>Open your Fincomp account</h1>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      <label class="field">
        <span>Full name</span>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Your full name"
              autocomplete="name" required [disabled]="loading()" />
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com"
              autocomplete="email" required [disabled]="loading()" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password"
              autocomplete="new-password" required [disabled]="loading()" />
      </label>

      @if (error) {
        <div class="error-banner" role="alert">{{ error }}</div>
      }

      <button class="primary-btn" type="submit" [disabled]="loading()">
        @if (loading()) { Creating account… } @else { Create account }
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Log in</a>
    </div>
  </div>
</div>
