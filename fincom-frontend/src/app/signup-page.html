<app-auth-layout
  brandSide="left"
  variant="benefits"
  brandTitle="Your free account, ready in a minute."
  brandText="Join to compare banks and keep track of what you look at."
>
  <h1 class="auth-title">Create your account</h1>
  <p class="auth-sub">It only takes a few details.</p>

  <form class="auth-form" (ngSubmit)="submit()" novalidate>
    <div class="auth-field">
      <label for="name">Full name</label>
      <input class="auth-input" id="name" type="text" [(ngModel)]="name" name="name"
             placeholder="Your full name" autocomplete="name" [disabled]="loading()" />
    </div>

    <div class="auth-field">
      <label for="email">Email</label>
      <input class="auth-input" id="email" type="email" [(ngModel)]="email" name="email"
             placeholder="you@example.com" autocomplete="email" [disabled]="loading()" />
    </div>

    <app-password-field label="Password" name="password" placeholder="Create a password"
                        autocomplete="new-password" hint="At least 8 characters."
                        [(value)]="password" [disabled]="loading()" />

    @if (error()) {
      <div class="auth-error" role="alert">{{ error() }}</div>
    }

    <button class="auth-btn" type="submit" [disabled]="loading()">
      @if (loading()) { Creating account… } @else { Create account }
    </button>
  </form>

  <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
</app-auth-layout>
